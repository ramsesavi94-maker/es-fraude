<style>
  :root {
    --bg: #f5f3ee; --surface: #ffffff; --surface-2: #faf9f6; --ink: #17191c; --muted: #5f6368; --line: #e4e0d7;
    --brand: #14284b; --brand-ink: #ffffff; --brand-soft: #e7ecf5; --focus: #2f6fdd;
    --high: #b42318; --high-bg: #fdeceb; --high-line: #f3c4bf;
    --mid: #9a5b00; --mid-bg: #fff3dc; --mid-line: #f1d39a;
    --none: #34506e; --none-bg: #e9eff5; --none-line: #c8d6e5;
    --ok: #1f7a4d;
    --radius: 18px; --shadow: 0 1px 2px rgb(20 40 75 / 0.06), 0 8px 24px rgb(20 40 75 / 0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111214; --surface: #1b1c1f; --surface-2: #202125; --ink: #eeece7; --muted: #a3a29c; --line: #303136;
      --brand: #9db8e6; --brand-ink: #0f1d36; --brand-soft: #1e2a3d; --focus: #9db8e6;
      --high: #ff9a8f; --high-bg: #3a1916; --high-line: #5e2620;
      --mid: #ffc56b; --mid-bg: #36290f; --mid-line: #5a4416;
      --none: #b3c7dc; --none-bg: #1c2632; --none-line: #2f3f52;
      --ok: #6fd3a0;
      --shadow: none;
    }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }

  a { color: var(--brand); }
  .wrap { max-width: 680px; margin: 0 auto; padding: 0 16px; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 8px; }
  svg.i { width: 20px; height: 20px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* Header */
  header.top { display: flex; align-items: center; justify-content: space-between; padding: 14px 0; }
  .logo { display: flex; align-items: center; gap: 8px; font-weight: 800; letter-spacing: -0.01em; color: var(--ink); text-decoration: none; font-size: 1.05rem; }
  .logo .mark { width: 32px; height: 32px; border-radius: 10px; background: var(--brand); color: var(--brand-ink); display: grid; place-items: center; }
  .lang { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--surface); }
  .lang button { border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 0.85rem; font-weight: 600; padding: 4px 12px; border-radius: 999px; cursor: pointer; }
  .lang button[aria-pressed="true"] { background: var(--brand); color: var(--brand-ink); }

  /* Hero */
  .hero { padding: 18px 0 8px; }
  .eyebrow { display: inline-flex; gap: 6px; align-items: center; font-size: 0.82rem; font-weight: 600; color: var(--brand); background: var(--brand-soft); padding: 4px 10px; border-radius: 999px; }
  h1 { font-size: clamp(1.9rem, 6vw, 2.6rem); line-height: 1.1; letter-spacing: -0.025em; margin: 12px 0 10px; }
  .lead { color: var(--muted); font-size: 1.05rem; margin: 0 0 16px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 0 0 20px; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; }
  .stat b { display: block; font-size: 1.2rem; letter-spacing: -0.02em; }
  .stat span { display: block; font-size: 0.78rem; color: var(--muted); line-height: 1.3; }
  .source-note { font-size: 0.75rem; color: var(--muted); margin: -12px 0 18px; }

  /* Card + input */
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; }
  .tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; background: var(--surface-2); border: 1px solid var(--line); padding: 4px; border-radius: 14px; margin-bottom: 14px; }
  .tabs button { display: grid; justify-items: center; gap: 2px; border: 0; background: transparent; color: var(--muted); padding: 8px 2px; border-radius: 10px; font: inherit; font-size: 0.8rem; font-weight: 600; cursor: pointer; }
  .tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgb(0 0 0 / 0.12); }
  label.hint { display: block; color: var(--muted); font-size: 0.95rem; margin-bottom: 8px; }
  textarea { width: 100%; min-height: 150px; border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; font: inherit; background: var(--surface-2); color: var(--ink); resize: vertical; }
  textarea.short { min-height: 58px; }
  .drop { display: grid; place-items: center; gap: 8px; border: 2px dashed var(--line); border-radius: 14px; padding: 26px 16px; text-align: center; cursor: pointer; color: var(--muted); background: var(--surface-2); }
  .drop:hover { border-color: var(--brand); }
  .drop img { max-width: 100%; max-height: 320px; border-radius: 10px; }
  .primary { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; margin-top: 12px; border: 0; border-radius: 14px; padding: 15px; font: inherit; font-weight: 700; font-size: 1.05rem; background: var(--brand); color: var(--brand-ink); cursor: pointer; }
  .primary:disabled { opacity: 0.6; cursor: wait; }
  .examples { margin-top: 14px; }
  .examples p { margin: 0 0 6px; font-size: 0.85rem; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); border-radius: 999px; padding: 7px 12px; font: inherit; font-size: 0.88rem; cursor: pointer; }
  .chip:hover { border-color: var(--brand); }
  .error { margin: 14px 0 0; color: var(--high); font-weight: 600; }

  /* Progress */
  .progress { margin-top: 16px; display: grid; gap: 10px; }
  .step { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 0.95rem; }
  .step .dot { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; flex: none; }
  .step.active { color: var(--ink); font-weight: 600; }
  .step.active .dot { border-color: var(--brand); border-top-color: transparent; animation: spin 0.8s linear infinite; }
  .step.done { color: var(--ink); }
  .step.done .dot { border-color: var(--ok); background: var(--ok); color: var(--surface); }
  .step .tag { margin-left: auto; font-size: 0.72rem; font-weight: 600; color: var(--brand); background: var(--brand-soft); padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .step.active .dot { animation: none; border-top-color: var(--brand); } }

  /* Result */
  .result { margin-top: 20px; display: grid; gap: 12px; }
  .verdict { border-radius: var(--radius); padding: 18px; border: 1px solid; }
  .verdict.alto { background: var(--high-bg); border-color: var(--high-line); }
  .verdict.medio { background: var(--mid-bg); border-color: var(--mid-line); }
  .verdict.sin_senales { background: var(--none-bg); border-color: var(--none-line); }
  .verdict .head { display: flex; align-items: center; gap: 10px; }

  .verdict.alto .head { color: var(--high); } .verdict.medio .head { color: var(--mid); } .verdict.sin_senales .head { color: var(--none); }
  .verdict .level { font-size: 1.35rem; font-weight: 800; letter-spacing: -0.01em; line-height: 1.2; }
  .meter { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin: 12px 0; }
  .meter span { height: 6px; border-radius: 3px; background: rgb(127 127 127 / 0.2); }
  .verdict.medio .meter span:nth-child(-n+2), .verdict.alto .meter span { background: currentColor; }
  .verdict.sin_senales .meter span:first-child { background: currentColor; }
  .verdict.alto .meter { color: var(--high); } .verdict.medio .meter { color: var(--mid); } .verdict.sin_senales .meter { color: var(--none); }
  .verdict p { margin: 0; }
  .pattern-tag { display: inline-block; margin-top: 10px; font-size: 0.82rem; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); }
  .section h2 { display: flex; align-items: center; gap: 8px; font-size: 1rem; margin: 0 0 10px; }
  .section h2 svg { color: var(--brand); }
  ul.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .signal blockquote { margin: 6px 0 0; padding: 8px 12px; border-left: 3px solid var(--line); background: var(--surface-2); border-radius: 0 10px 10px 0; color: var(--muted); font-size: 0.93rem; overflow-wrap: anywhere; }
  .check { display: grid; gap: 2px; font-size: 0.93rem; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
  .check:last-child { border-bottom: 0; padding-bottom: 0; }
  .check a { font-size: 0.83rem; overflow-wrap: anywhere; }
  ol.steps { margin: 0; padding-left: 22px; display: grid; gap: 8px; }
  .channel { display: flex; justify-content: space-between; gap: 12px; align-items: center; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
  .channel:last-child { border-bottom: 0; padding-bottom: 0; }
  .channel .name { font-weight: 700; }
  .channel .use { color: var(--muted); font-size: 0.88rem; }
  .channel .src { font-size: 0.8rem; color: var(--muted); }
  .channel .actions { display: grid; gap: 6px; justify-items: end; }
  .call { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; text-decoration: none; font-weight: 700; font-size: 0.9rem; color: var(--brand-ink); background: var(--brand); padding: 7px 12px; border-radius: 999px; }
  .call.secondary { background: var(--brand-soft); color: var(--brand); }
  .report textarea { min-height: 130px; font-size: 0.93rem; }
  .note { font-size: 0.85rem; color: var(--muted); margin: 0 0 8px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .ghost { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 12px; padding: 10px 14px; font: inherit; font-weight: 600; cursor: pointer; }
  .meta { font-size: 0.8rem; color: var(--muted); text-align: center; }
  .meta a { color: var(--muted); }

  /* How it works */
  .how { margin: 32px 0 8px; }
  .how h2 { font-size: 1.25rem; letter-spacing: -0.01em; margin: 0 0 12px; }
  .how ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; counter-reset: s; }
  .how li { counter-increment: s; display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: start; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
  .how li::before { content: counter(s); width: 30px; height: 30px; border-radius: 10px; background: var(--brand-soft); color: var(--brand); font-weight: 800; display: grid; place-items: center; }
  .how li b { display: block; }
  .how li span { color: var(--muted); font-size: 0.92rem; }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .badge { font-size: 0.78rem; font-weight: 600; border: 1px solid var(--line); background: var(--surface); padding: 4px 10px; border-radius: 999px; }

  /* Report flow */
  .report-flow { display: grid; gap: 14px; }
  .rstep { border-top: 1px solid var(--line); padding-top: 14px; }
  .rstep:first-of-type { border-top: 0; padding-top: 0; }
  .rstep h3 { display: flex; align-items: center; gap: 8px; font-size: 0.98rem; margin: 0 0 8px; }
  .rstep h3 .n { width: 24px; height: 24px; border-radius: 8px; background: var(--brand); color: var(--brand-ink); font-size: 0.8rem; display: grid; place-items: center; flex: none; }
  .yesno { display: flex; gap: 8px; }
  .yesno button { flex: 1; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); border-radius: 12px; padding: 10px; font: inherit; font-weight: 600; cursor: pointer; }
  .yesno button[aria-pressed="true"] { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
  .urgent { margin-top: 10px; background: var(--high-bg); border: 1px solid var(--high-line); border-radius: 12px; padding: 12px 12px 12px 30px; }
  .urgent li { margin-bottom: 6px; }
  .urgent a { font-size: 0.8rem; }
  .evidence label { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; cursor: pointer; }
  .evidence input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--brand); flex: none; }
  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .fields label { display: grid; gap: 4px; font-size: 0.85rem; color: var(--muted); }
  .fields .wide { grid-column: 1 / -1; }
  .fields input, .fields select { font: inherit; font-size: 0.95rem; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; width: 100%; }
  .route { border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: grid; gap: 6px; background: var(--surface-2); }
  .route.featured { border-color: var(--brand); }
  .route .top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .route .rtype { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; color: var(--brand); white-space: nowrap; }
  .route .when { color: var(--muted); font-size: 0.88rem; }
  .route .acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
  .route .script { margin: 4px 0 0; padding-left: 20px; font-size: 0.9rem; }
  .btn { display: inline-flex; align-items: center; gap: 6px; border: 0; text-decoration: none; font: inherit; font-weight: 700; font-size: 0.88rem; padding: 8px 12px; border-radius: 999px; cursor: pointer; background: var(--brand); color: var(--brand-ink); }
  .btn.soft { background: var(--brand-soft); color: var(--brand); }
  .local-note { font-size: 0.8rem; color: var(--muted); margin: 8px 0 0; }
  @media (max-width: 420px) { .fields { grid-template-columns: 1fr; } }
  footer { margin: 28px 0 40px; font-size: 0.85rem; color: var(--muted); display: grid; gap: 6px; }
  footer a { color: var(--muted); }
  [hidden] { display: none !important; }
  @media (max-width: 380px) { .stat b { font-size: 1.05rem; } .tabs button { font-size: 0.74rem; } }
</style>

const $ = (id) => document.getElementById(id);
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };

let lang = new URLSearchParams(location.search).get("lang") || store.get("lang") || (navigator.language || "es").slice(0, 2);
if (!I18N[lang]) lang = "es";
let kind = "message";
let image = null;
let timers = [];
const t = (key) => I18N[lang][key];

function el(tag, props = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "class") node.className = v; else if (k === "text") node.textContent = v; else node.setAttribute(k, v);
  }
  for (const c of children) if (c != null && c !== false) node.append(c);
  return node;
}
function icon(name, cls = "i") {
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("class", cls);
  svg.setAttribute("aria-hidden", "true");
  const use = document.createElementNS("http://www.w3.org/2000/svg", "use");
  use.setAttribute("href", `#i-${name}`);
  svg.append(use);
  return svg;
}

function applyLang() {
  document.documentElement.lang = lang;
  for (const node of document.querySelectorAll("[data-i18n]")) node.textContent = t(node.dataset.i18n);
  for (const b of document.querySelectorAll(".lang button")) b.setAttribute("aria-pressed", String(b.dataset.lang === lang));
  document.title = lang === "en" ? "¿Es fraude? · Is it a scam?" : "¿Es fraude?";
  setHints();
  if (image) $("drop-label").textContent = t("dropChange");
}

function setHints() {
  const key = { message: "Message", call: "Call", app: "App" }[kind];
  if (!key) return;
  $("text-hint").textContent = t(`hint${key}`);
  $("text").placeholder = t(`ph${key}`);
  $("text").classList.toggle("short", kind === "app");
}

function selectKind(next) {
  kind = next;
  for (const b of document.querySelectorAll(".tabs button")) b.setAttribute("aria-selected", String(b.dataset.kind === next));
  $("image-input").hidden = next !== "screenshot";
  $("text-input").hidden = next === "screenshot";
  setHints();
}

for (const b of document.querySelectorAll(".lang button")) {
  b.addEventListener("click", () => {
    lang = b.dataset.lang;
    store.set("lang", lang);
    const url = new URL(location.href);
    url.searchParams.set("lang", lang);
    history.replaceState(null, "", url);
    $("result").hidden = true;
    applyLang();
  });
}
for (const b of document.querySelectorAll(".tabs button")) b.addEventListener("click", () => selectKind(b.dataset.kind));
for (const b of document.querySelectorAll("[data-example]")) {
  b.addEventListener("click", () => {
    const ex = EXAMPLES[b.dataset.example];
    selectKind(ex.kind);
    $("text").value = ex.text;
    submit();
  });
}

// Shrinks photos before upload: phone screenshots are often several MB.
$("file").addEventListener("change", async () => {
  const file = $("file").files[0];
  if (!file) return;
  const bitmap = await createImageBitmap(file);
  const scale = Math.min(1, 1600 / Math.max(bitmap.width, bitmap.height));
  const canvas = Object.assign(document.createElement("canvas"), { width: Math.round(bitmap.width * scale), height: Math.round(bitmap.height * scale) });
  canvas.getContext("2d").drawImage(bitmap, 0, 0, canvas.width, canvas.height);
  image = canvas.toDataURL("image/jpeg", 0.85);
  $("preview").src = image;
  $("preview").hidden = false;
  $("drop-label").textContent = t("dropChange");
});

$("form").addEventListener("submit", (e) => { e.preventDefault(); submit(); });

async function submit() {
  const text = $("text").value.trim();
  if (kind === "screenshot" ? !image : !text) return showError(kind === "screenshot" ? t("needImage") : t("needText"));
  const payload = kind === "screenshot" ? { kind, image, lang } : { kind, text, lang };

  $("error").hidden = true;
  $("result").hidden = true;
  $("submit").disabled = true;
  const started = performance.now();
  startProgress();
  try {
    const res = await fetch("/api/analyze", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || t("failed"));
    render(data, ((performance.now() - started) / 1000).toFixed(1));
  } catch (err) {
    showError(err.message);
  } finally {
    stopProgress();
    $("submit").disabled = false;
  }
}

// The steps mirror the real pipeline; their timing is approximate because the API answers once.
function startProgress() {
  const labels = [...(kind === "screenshot" ? ["stepImage"] : []), "stepRead", "stepVerify", "stepReason"];
  const tags = { stepImage: "Nemotron Super VL", stepRead: "Nemotron Super", stepVerify: "Tavily", stepReason: "Nemotron Ultra" };
  const box = $("progress");
  box.replaceChildren(...labels.map((l) => el("div", { class: "step" }, el("span", { class: "dot" }), el("span", { text: t(l) }), el("span", { class: "tag", text: tags[l] }))));
  box.hidden = false;
  const steps = [...box.children];
  const set = (i) => steps.forEach((s, j) => { s.className = `step ${j < i ? "done" : j === i ? "active" : ""}`; if (j < i) s.firstChild.replaceChildren(icon("check", "i")); });
  set(0);
  timers = steps.slice(1).map((_, i) => setTimeout(() => set(i + 1), (i + 1) * 2800));
}
function stopProgress() { timers.forEach(clearTimeout); $("progress").hidden = true; }
function showError(msg) { $("error").textContent = msg; $("error").hidden = false; }

function section(title, iconName, ...content) {
  return el("div", { class: "card section" }, el("h2", {}, icon(iconName), el("span", { text: title })), ...content);
}

function contactActions(contact) {
  const box = el("div", { class: "actions" });
  for (const part of contact.split("·").map((s) => s.trim())) {
    const digits = part.replace(/ext\..*$/i, "").replace(/\D/g, "");
    if (/@/.test(part)) box.append(el("a", { class: "call secondary", href: `mailto:${part}`, text: part }));
    else if (digits.length >= 3 && /^[\d\s]+(ext\.\s*\d+)?$/i.test(part)) { const a = el("a", { class: "call", href: `tel:${digits}` }, icon("phone"), el("span", { text: part })); box.append(a); }
    else box.append(el("span", { class: "use", text: part }));
  }
  return box;
}

const STATES = ["Aguascalientes", "Baja California", "Baja California Sur", "Campeche", "Chiapas", "Chihuahua", "Ciudad de México", "Coahuila", "Colima", "Durango", "Estado de México", "Guanajuato", "Guerrero", "Hidalgo", "Jalisco", "Michoacán", "Morelos", "Nayarit", "Nuevo León", "Oaxaca", "Puebla", "Querétaro", "Quintana Roo", "San Luis Potosí", "Sinaloa", "Sonora", "Tabasco", "Tamaulipas", "Tlaxcala", "Veracruz", "Yucatán", "Zacatecas"];

/**
 * Guides the person from "this is a scam" to "I reported it": urgent steps if
 * money or data is already gone, an evidence checklist, local-only details that
 * complete the draft, and one-tap actions for each verified channel.
 */
function renderReport(plan, baseDraft) {
  const form = { date: "", state: store.get("state") || "", name: "", amount: "", account: "", paid: null };
  const evidenceChecked = new Set();

  const compose = () => {
    const lines = [t("draftHeader"), ""];
    const add = (label, value) => { if (value) lines.push(`${label}: ${value}`); };
    add(t("dReceived"), form.date ? new Date(form.date).toLocaleString("es-MX", { dateStyle: "long", timeStyle: "short" }) : "");
    add(t("dState"), form.state);
    add(I18N.es.dPaid, form.paid === null ? "" : form.paid ? I18N.es.dYes : I18N.es.dNo);
    add(t("dName"), form.name);
    add(t("dAmount"), form.amount);
    add(t("dAccount"), form.account);
    if (lines.length > 2) lines.push("");
    lines.push(`${t("dFacts")}:`, baseDraft);
    if (evidenceChecked.size) lines.push("", `${t("dEvidence")}:`, ...[...evidenceChecked].map((e) => `- ${e}`));
    return lines.join("\n");
  };

  const area = el("textarea", { "aria-label": t("reportTitle") });
  const refresh = () => { area.value = compose(); renderRoutes(); };

  // Step 1: already paid?
  const urgentBox = el("div");
  const yes = el("button", { type: "button", "aria-pressed": "false", text: t("yes") });
  const no = el("button", { type: "button", "aria-pressed": "false", text: t("no") });
  const pick = (paid) => {
    form.paid = paid;
    refresh();
    yes.setAttribute("aria-pressed", String(paid));
    no.setAttribute("aria-pressed", String(!paid));
    urgentBox.replaceChildren();
    if (paid && plan.urgent.length) {
      urgentBox.append(el("p", { class: "note", text: t("urgentIntro") }),
        el("ol", { class: "urgent" }, ...plan.urgent.map((u) => el("li", {}, el("span", { text: u.text + " " }), el("a", { href: u.source, target: "_blank", rel: "noopener", text: t("officialSource") })))));
    } else if (!paid) {
      urgentBox.append(el("p", { class: "note", text: t("noUrgent") }));
    }
  };
  yes.addEventListener("click", () => pick(true));
  no.addEventListener("click", () => pick(false));

  // Step 2: evidence checklist
  const evidence = el("div", { class: "evidence" });
  for (const item of plan.evidence) {
    const box = el("input", { type: "checkbox" });
    box.addEventListener("change", () => { box.checked ? evidenceChecked.add(item) : evidenceChecked.delete(item); refresh(); });
    evidence.append(el("label", {}, box, el("span", { text: item })));
  }

  // Step 3: local-only details
  const field = (key, label, input, wide) => {
    input.addEventListener("input", () => { form[key] = input.value.trim(); if (key === "state") store.set("state", input.value); refresh(); });
    return el("label", wide ? { class: "wide" } : {}, el("span", { text: label }), input);
  };
  const stateSel = el("select", {}, el("option", { value: "", text: t("chooseState") }), ...STATES.map((s) => el("option", { value: s, text: s })));
  stateSel.value = form.state;
  const fields = el("div", { class: "fields" },
    field("date", t("fDate"), el("input", { type: "datetime-local" })),
    field("state", t("fState"), stateSel),
    field("name", t("fName"), el("input", { type: "text", autocomplete: "name" }), true),
    field("amount", t("fAmount"), el("input", { type: "text", inputmode: "decimal" })),
    field("account", t("fAccount"), el("input", { type: "text" })));

  // Step 4: routes with one-tap actions
  const routesBox = el("div", { class: "list", style: "display:grid;gap:10px" });
  function renderRoutes() {
    const visible = plan.routes.filter((r) => !r.state || r.state === form.state);
    visible.sort((a, b) => Number(Boolean(b.state)) - Number(Boolean(a.state)));
    const hasStateRoute = plan.routes.some((r) => r.state && r.state === form.state);
    const hint = !form.state ? t("pickStateHint") : hasStateRoute ? "" : t("noOnlineState");
    routesBox.replaceChildren(...(hint ? [el("p", { class: "note", text: hint })] : []), ...visible.map((r) => {
      const acts = el("div", { class: "acts" });
      if (r.channel === "email") {
        const body = area.value.length > 1800 ? area.value.slice(0, 1800) + "…" : area.value;
        acts.append(el("a", { class: "btn", href: `mailto:${r.target}?subject=${encodeURIComponent(t("emailSubject"))}&body=${encodeURIComponent(body)}` }, icon("doc"), el("span", { text: t("sendEmail") })));
      } else if (r.channel === "form") {
        const b = el("button", { class: "btn", type: "button" }, icon("copy"), el("span", { text: t("copyOpen") }));
        b.addEventListener("click", async () => { try { await navigator.clipboard.writeText(area.value); } catch {} window.open(r.target, "_blank", "noopener"); b.lastChild.textContent = t("copiedOpening"); });
        acts.append(b);
      } else if (r.channel === "phone") {
        acts.append(el("a", { class: "btn", href: `tel:${r.target.replace(/\D/g, "")}` }, icon("phone"), el("span", { text: `${t("callNow")} ${r.target}` })));
      } else {
        acts.append(el("a", { class: "btn soft", href: r.target, target: "_blank", rel: "noopener" }, icon("info"), el("span", { text: t("howToReport") })));
      }
      const card = el("div", { class: `route${r.state ? " featured" : ""}` },
        el("div", { class: "top" }, el("strong", { text: r.name }), el("span", { class: "rtype", text: t(TYPE_LABEL[r.type]) })),
        el("span", { class: "when", text: r.when }), acts);
      if (r.script?.length) {
        const details = el("details", {}, el("summary", { text: t("whatToSay") }), el("ul", { class: "script" }, ...r.script.map((x) => el("li", { text: x }))));
        card.append(details);
      }
      card.append(el("a", { class: "src", href: r.source, target: "_blank", rel: "noopener", text: t("officialSource") }));
      return card;
    }));
  }

  // Draft actions
  const copy = el("button", { class: "ghost", type: "button" }, icon("copy"), el("span", { text: t("copyDraft") }));
  copy.addEventListener("click", async () => { try { await navigator.clipboard.writeText(area.value); copy.lastChild.textContent = t("copied"); } catch { area.select(); } });
  const download = el("button", { class: "ghost", type: "button" }, icon("doc"), el("span", { text: t("download") }));
  download.addEventListener("click", () => {
    const url = URL.createObjectURL(new Blob([area.value], { type: "text/plain;charset=utf-8" }));
    el("a", { href: url, download: "reporte-fraude.txt" }).click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  });
  const actions = el("div", { class: "row" }, copy, download);
  if (navigator.share) {
    const share = el("button", { class: "ghost", type: "button" }, icon("msg"), el("span", { text: t("share") }));
    share.addEventListener("click", () => navigator.share({ title: t("emailSubject"), text: area.value }).catch(() => {}));
    actions.append(share);
  }

  const step = (n, title, ...content) => el("div", { class: "rstep" }, el("h3", {}, el("span", { class: "n", text: String(n) }), el("span", { text: title })), ...content);
  refresh();
  return section(t("reportFlowTitle"), "flag",
    el("div", { class: "report-flow" },
      step(1, t("r1"), el("div", { class: "yesno" }, yes, no), urgentBox),
      step(2, t("r2"), evidence),
      step(3, t("r3"), fields, el("p", { class: "local-note", text: t("r3note") }), el("div", { class: "report", style: "margin-top:10px" }, area), actions),
      step(4, t("r4"), routesBox)));
}

function render({ verdict: v, checks }, seconds) {
  const out = $("result");
  out.replaceChildren();

  const head = { alto: ["alert", t("riskAlto")], medio: ["alert", t("riskMedio")], sin_senales: ["info", t("riskSin")] }[v.risk];
  const card = el("div", { class: `verdict ${v.risk}` },
    el("div", { class: "head" }, icon(head[0]), el("span", { class: "level", text: head[1] })),
    el("div", { class: "meter", "aria-hidden": "true" }, el("span"), el("span"), el("span")),
    el("p", { text: v.summary }));
  if (v.patterns.length) card.append(el("span", { class: "pattern-tag", text: `${t("patternLabel")} ${v.patterns.map((p) => p.name).join(", ")}` }));
  out.append(card);

  if (v.signals.length) {
    const list = el("ul", { class: "list" });
    for (const s of v.signals) list.append(el("li", { class: "signal" }, el("span", { text: s.signal }), el("blockquote", { text: `“${s.quote}”` })));
    out.append(section(v.risk === "sin_senales" ? t("observedTitle") : t("signalsTitle"), "flag", list));
  }

  out.append(section(t("whatToDoTitle"), "list", el("ol", { class: "steps" }, ...v.whatToDo.map((s) => el("li", { text: s })))));

  const channels = el("ul", { class: "list" });
  for (const ch of v.channels) {
    channels.append(el("li", { class: "channel" },
      el("div", {}, el("div", { class: "name", text: ch.name }), el("div", { class: "use", text: ch.use }),
        el("a", { class: "src", href: ch.url, target: "_blank", rel: "noopener", text: t("officialSource") })),
      contactActions(ch.contact)));
  }
  out.append(section(t("channelsTitle"), "phone", channels));

  if (checks.length) {
    const list = el("ul", { class: "list" });
    for (const c of checks) {
      const item = el("li", { class: "check" }, el("strong", { text: c.check }), el("span", { text: c.result }));
      for (const e of c.evidence ?? []) item.append(el("a", { href: e.url, target: "_blank", rel: "noopener", text: e.title || e.url }));
      list.append(item);
    }
    out.append(section(t("checksTitle"), "search", list));
  }

  if (v.report && v.reportDraft) out.append(renderReport(v.report, v.reportDraft));

  const again = el("button", { class: "ghost", type: "button" }, icon("back"), el("span", { text: t("again") }));
  again.addEventListener("click", () => { out.hidden = true; $("text").value = ""; window.scrollTo({ top: 0, behavior: "smooth" }); });
  const meta = el("p", { class: "meta", text: t("meta")(seconds) + " " });
  if (v.patterns.length) {
    meta.append(t("sources") + " ");
    v.patterns.flatMap((p) => p.sources).forEach((u, i) => { if (i) meta.append(", "); meta.append(el("a", { href: u, target: "_blank", rel: "noopener", text: new URL(u).hostname.replace(/^www\./, "") })); });
  }
  out.append(el("div", { class: "row", style: "justify-content:center" }, again), meta);

  out.hidden = false;
  out.scrollIntoView({ behavior: "smooth", block: "start" });
}

applyLang();
</script>
</body>
</html>
